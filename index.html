<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatTest Recommender | Zero-Storage Statistical Advisor</title>
    <!-- Google Fonts & PapaParse for Client-Side CSV Parsing -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .badge-privacy {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 0.75rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }
        .btn-danger:hover { background: #fecaca; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        select {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            font-size: 0.95rem;
        }

        /* Results Styling */
        #results-container {
            display: none;
        }

        .recommendation-card {
            border-left: 4px solid var(--primary);
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1.5rem;
        }

        .recommendation-card h3 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .logic-explanation {
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .viz-preview {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            margin-top: 1rem;
        }

        .viz-preview svg {
            max-width: 100%;
            height: auto;
        }

        .viz-caption {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Statistical Test Recommender</h1>
        <p>Zero-storage, client-side automated test selection and publication-ready visualization guide.</p>
        <div class="badge-privacy">🔒 100% Private: Data stays in your browser memory only</div>
    </header>

    <!-- Input Section -->
    <div class="card">
        <h2>1. Provide Dataset</h2>
        <label for="csv-input">Paste CSV Data (or upload file):</label>
        <textarea id="csv-input" placeholder="group,score,age\nControl,85,22\nControl,88,24\nTreatment,92,23\nTreatment,95,25"></textarea>
        
        <div class="form-row">
            <div>
                <label for="iv-type">Independent Variable (IV) Type:</label>
                <select id="iv-type">
                    <option value="categorical">Categorical (Groups / Categories)</option>
                    <option value="continuous">Continuous (Numeric Measurement)</option>
                </select>
            </div>
            <div>
                <label for="dv-type">Dependent Variable (DV) Type:</label>
                <select id="dv-type">
                    <option value="continuous">Continuous (Numeric Scale)</option>
                    <option value="categorical">Categorical (Count / Frequency)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label for="num-groups">Number of Groups / Levels:</label>
                <select id="num-groups">
                    <option value="2">2 Groups</option>
                    <option value="3">3 or More Groups</option>
                </select>
            </div>
            <div>
                <label for="normality">Data Distribution (Normality):</label>
                <select id="normality">
                    <option value="normal">Normally Distributed</option>
                    <option value="non-normal">Skewed / Non-Normal / Ordinal</option>
                </select>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="analyzeData()">Analyze & Recommend Test</button>
            <button class="btn-danger" onclick="clearDataset()">Clear Dataset</button>
        </div>
    </div>

    <!-- Results Section -->
    <div id="results-container" class="card">
        <h2>2. Recommended Statistical Test & Visualization</h2>
        <div id="recommendation-output"></div>
    </div>
</div>

<script>
    function analyzeData() {
        const csvText = document.getElementById('csv-input').value.trim();
        const ivType = document.getElementById('iv-type').value;
        const dvType = document.getElementById('dv-type').value;
        const numGroups = document.getElementById('num-groups').value;
        const normality = document.getElementById('normality').value;

        if (csvText === "") {
            alert("Please paste or type sample data into the textarea first.");
            return;
        }

        // Parse CSV using PapaParse (purely in-memory)
        const parsed = Papa.parse(csvText, { header: true, dynamicTyping: true });
        console.log("Parsed rows in memory:", parsed.data.length);

        let testName = "";
        let rationale = "";
        let svgViz = "";

        // Decision Tree Logic
        if (ivType === 'categorical' && dvType === 'continuous') {
            if (numGroups === '2') {
                if (normality === 'normal') {
                    testName = "Independent Samples t-Test";
                    rationale = "Your independent variable splits data into 2 distinct groups, and your dependent variable is continuous. Because the data is normally distributed, the parametric t-test provides the highest statistical power to compare group means.";
                    svgViz = `
                        <svg width="400" height="200" viewBox="0 0 400 200">
                            <rect width="400" height="200" fill="#ffffff" rx="8"/>
                            <!-- Boxplot Group 1 -->
                            <line x1="120" y1="60" x2="120" y2="150" stroke="#64748b" stroke-width="2"/>
                            <rect x="90" y="80" width="60" height="50" fill="#e0e7ff" stroke="#2563eb" stroke-width="2" rx="4"/>
                            <line x1="90" y1="105" x2="150" y2="105" stroke="#1d4ed8" stroke-width="3"/>
                            <!-- Boxplot Group 2 -->
                            <line x1="280" y1="40" x2="280" y2="130" stroke="#64748b" stroke-width="2"/>
                            <rect x="250" y="60" width="60" height="50" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" rx="4"/>
                            <line x1="250" y1="80" x2="310" y2="80" stroke="#0f766e" stroke-width="3"/>
                            <!-- Labels -->
                            <text x="120" y="175" text-anchor="middle" font-size="12" fill="#334155" font-family="Inter">Control Group</text>
                            <text x="280" y="175" text-anchor="middle" font-size="12" fill="#334155" font-family="Inter">Treatment Group</text>
                            <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Inter">Publication-Ready Box Plot (t-Test)</text>
                        </svg>`;
                } else {
                    testName = "Mann-Whitney U Test (Wilcoxon Rank-Sum)";
                    rationale = "Your dependent variable is continuous with 2 groups, but the distribution is non-normal or ordinal. The Mann-Whitney U test evaluates differences in rank sums without assuming a normal distribution.";
                    svgViz = `
                        <svg width="400" height="200" viewBox="0 0 400 200">
                            <rect width="400" height="200" fill="#ffffff" rx="8"/>
                            <!-- Violin / Distribution curves -->
                            <path d="M 90 140 Q 60 100 90 60 Q 120 100 90 140" fill="#e0e7ff" opacity="0.6"/>
                            <circle cx="90" cy="100" r="5" fill="#2563eb"/>
                            <path d="M 290 130 Q 250 90 290 50 Q 330 90 290 130" fill="#ccfbf1" opacity="0.6"/>
                            <circle cx="290" cy="85" r="5" fill="#0d9488"/>
                            <text x="90" y="175" text-anchor="middle" font-size="12" fill="#334155" font-family="Inter">Group A (Medians)</text>
                            <text x="290" y="175" text-anchor="middle" font-size="12" fill="#334155" font-family="Inter">Group B (Medians)</text>
                            <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Inter">Violin Plot / Median Comparison</text>
                        </svg>`;
                }
            } else {
                if (normality === 'normal') {
                    testName = "One-Way ANOVA (Analysis of Variance)";
                    rationale = "You are comparing 3 or more independent groups on a continuous, normally distributed dependent variable. ANOVA evaluates whether at least one group mean differs significantly by analyzing variance ratios.";
                    svgViz = `
                        <svg width="400" height="200" viewBox="0 0 400 200">
                            <rect width="400" height="200" fill="#ffffff" rx="8"/>
                            <!-- 3 Bar Means with Error Bars -->
                            <rect x="70" y="90" width="50" height="60" fill="#e0e7ff" rx="4"/>
                            <line x1="95" y1="70" x2="95" y2="150" stroke="#1d4ed8" stroke-width="2"/>
                            
                            <rect x="175" y="50" width="50" height="100" fill="#bfdbfe" rx="4"/>
                            <line x1="200" y1="35" x2="200" y2="150" stroke="#1d4ed8" stroke-width="2"/>

                            <rect x="280" y="110" width="50" height="40" fill="#dbeafe" rx="4"/>
                            <line x1="305" y1="95" x2="305" y2="150" stroke="#1d4ed8" stroke-width="2"/>

                            <text x="95" y="175" text-anchor="middle" font-size="11" fill="#334155" font-family="Inter">Group 1</text>
                            <text x="200" y="175" text-anchor="middle" font-size="11" fill="#334155" font-family="Inter">Group 2</text>
                            <text x="305" y="175" text-anchor="middle" font-size="11" fill="#334155" font-family="Inter">Group 3</text>
                            <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Inter">Bar Chart with 95% Confidence Intervals</text>
                        </svg>`;
                } else {
                    testName = "Kruskal-Wallis H Test";
                    rationale = "You have 3 or more groups with non-normal continuous data. The Kruskal-Wallis test serves as the non-equivalent non-parametric alternative to One-Way ANOVA.";
                    svgViz = `
                        <svg width="400" height="200" viewBox="0 0 400 200">
                            <rect width="400" height="200" fill="#ffffff" rx="8"/>
                            <circle cx="100" cy="110" r="25" fill="#e0e7ff" stroke="#2563eb"/>
                            <circle cx="200" cy="70" r="30" fill="#bfdbfe" stroke="#2563eb"/>
                            <circle cx="300" cy="130" r="20" fill="#dbeafe" stroke="#2563eb"/>
                            <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Inter">Rank-Order Distribution Spread</text>
                        </svg>`;
                }
            }
        } else if (ivType === 'categorical' && dvType === 'categorical') {
            testName = "Chi-Square Test of Independence";
            rationale = "Both your independent and dependent variables are categorical (frequency counts). The Chi-Square test determines whether there is a significant association between the two categorical variables.";
            svgViz = `
                <svg width="400" height="200" viewBox="0 0 400 200">
                    <rect width="400" height="200" fill="#ffffff" rx="8"/>
                    <!-- Stacked Bar Chart -->
                    <rect x="100" y="60" width="70" height="90" fill="#93c5fd" rx="4"/>
                    <rect x="100" y="60" width="70" height="40" fill="#2563eb" rx="4"/>

                    <rect x="230" y="80" width="70" height="70" fill="#93c5fd" rx="4"/>
                    <rect x="230" y="80" width="70" height="20" fill="#2563eb" rx="4"/>

                    <text x="135" y="175" text-anchor="middle" font-size="11" fill="#334155" font-family="Inter">Category A</text>
                    <text x="265" y="175" text-anchor="middle" font-size="11" fill="#334155" font-family="Inter">Category B</text>
                    <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Inter">Stacked Proportional Bar Chart</text>
                </svg>`;
        } else {
            testName = "Simple Linear / Multiple Regression";
            rationale = "Your independent and dependent variables are continuous. Regression models the linear relationship and predictive capacity of independent predictors on the outcome variable.";
            svgViz = `
                <svg width="400" height="200" viewBox="0 0 400 200">
                    <rect width="400" height="200" fill="#ffffff" rx="8"/>
                    <line x1="50" y1="160" x2="350" y2="160" stroke="#cbd5e1" stroke-width="2"/>
                    <line x1="50" y1="40" x2="50" y2="160" stroke="#cbd5e1" stroke-width="2"/>
                    <!-- Scatter points -->
                    <circle cx="80" cy="130" r="4" fill="#2563eb"/><circle cx="120" cy="110" r="4" fill="#2563eb"/>
                    <circle cx="170" cy="95" r="4" fill="#2563eb"/><circle cx="220" cy="75" r="4" fill="#2563eb"/>
                    <circle cx="280" cy="60" r="4" fill="#2563eb"/><circle cx="320" cy="50" r="4" fill="#2563eb"/>
                    <!-- Trendline -->
                    <line x1="60" y1="140" x2="340" y2="45" stroke="#dc2626" stroke-width="2" stroke-dasharray="4"/>
                    <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Inter">Scatter Plot with OLS Regression Line</text>
                </svg>`;
        }

        // Render Results
        const outputHtml = `
            <div class="recommendation-card">
                <h3>${testName}</h3>
                <p class="logic-explanation"><strong>Why this test fits your dataset:</strong> ${rationale}</p>
                <div class="viz-preview">
                    ${svgViz}
                    <div class="viz-caption">Figure 1. Example of a publication-ready graphical representation suitable for ${testName}.</div>
                </div>
            </div>
        `;

        document.getElementById('recommendation-output').innerHTML = outputHtml;
        document.getElementById('results-container').style.display = 'block';
    }

    function clearDataset() {
        // Purge textarea and reset form inputs
        document.getElementById('csv-input').value = '';
        document.getElementById('iv-type').selectedIndex = 0;
        document.getElementById('dv-type').selectedIndex = 0;
        document.getElementById('num-groups').selectedIndex = 0;
        document.getElementById('normality').selectedIndex = 0;
        
        // Hide and clear results
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('recommendation-output').innerHTML = '';
        
        alert("Dataset successfully cleared from browser memory.");
    }
</script>

</body>
</html>
